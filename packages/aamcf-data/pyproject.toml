[project]
name = "aamcf-data"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "python-dateutil>=2.9",
    "scikit-learn>=1.5",
    "pyarrow>=16.0",
    "orjson>=3.10",
    "tqdm>=4.66",
    "huggingface-hub>=1.31.0",
    "transformers>=5.18.0",
    "torch>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
